[project]
name = "market-digest"
version = "0.1.0"
description = "Daily S&P 500 movers digest: what moved, why, and a scored prediction"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
